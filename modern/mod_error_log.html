<div class="cwp-page">
  <div class="alert alert-warning" id="alertfl" style="display:{% if mod.fsl == 1 %}block{% else %}none{% endif %}">
    <strong>{{langene.GALARTFILEBLOCK}}</strong>
  </div>
  <div class="cwp-page-head">
    <div>
      <h2>{{langmod.ERRLOG001}}</h2>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="?">{{langene.GENLABLANG1}}</a></li>
        <li class="breadcrumb-item active"><strong>{{langmod.ERRLOG001}}</strong></li>
      </ol>
    </div>
  </div>

  <div class="ibox">
    <div class="ibox-content">
      <div class="cwp-log-filters">
        <div class="form-group">
          <label class="control-label" for="domainini">{{langmod.ERRLOG002}}</label>
          <select class="form-control" id="domainini">
            {% for domain in mod.listdomins %}
            <option value="{{ domain }}">{{ domain }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="control-label" for="tipe">{{langmod.ERRLOG0010}}</label>
          <select class="form-control" id="tipe">
            <option value="">{{langmod.ERRLOG005}}</option>
            <option value="error">Error Log</option>
            <option value="access">Access Log</option>
          </select>
        </div>
        <div class="form-group cwp-log-search">
          <label class="control-label" for="textsearch">{{langmod.ERRLOG0011}}</label>
          <input class="form-control" type="text" id="textsearch" value="" placeholder="{{langmod.ERRLOG009}}">
        </div>
        <div class="form-group">
          <label class="control-label" for="numline">{{langmod.ERRLOG0012}}</label>
          <input type="text" class="form-control" id="numline" value="20">
        </div>
        <div class="form-group">
          <button class="btn btn-success" id="btngeneratelog"><i class="fa fa-file-text-o"></i> {{langmod.ERRLOG006}}</button>
        </div>
      </div>
    </div>
  </div>

  <div class="ibox">
    <div class="ibox-content">
      <div id="result" class="cwp-log-viewer" style="display:none"></div>
    </div>
  </div>

  {% include 'footer.html' %}
</div>
